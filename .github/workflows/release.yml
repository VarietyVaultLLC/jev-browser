# Publishes to npm when a version tag is pushed:  npm version patch && git push --follow-tags
# Uses npm trusted publishing (OIDC), so no npm token is stored in GitHub. One-time setup:
#   npx npm@latest trust github jev-browser --file release.yml --repo Ying-Kai-Liao/jev-browser --allow-publish
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Tag matches package.json
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }
      - run: node scripts/sync-plugin-version.mjs --check   # the plugin pins jev-browser@<this version>
      - name: Publish to npm
        run: |
          V=$(node -p 'require("./package.json").version')
          if npm view "jev-browser@$V" version >/dev/null 2>&1; then echo "jev-browser@$V is already on npm, skipping"; else npm publish --access public; fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
